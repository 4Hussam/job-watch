name: job-watch

on:
  schedule:
    # every 6 hours: 00,06,12,18 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job watch
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATCH_TO: ${{ secrets.WATCH_TO }}
          WATCH_FROM: ${{ secrets.WATCH_FROM }}
        run: python watch.py

      # Dedup state lives on its own branch so that committing it can never
      # collide with a code push to main. main stays code-only.
      - name: Save seen-state
        run: |
          git config user.name  "job-watch"
          git config user.email "job-watch@users.noreply.github.com"
          git fetch origin seen-state --depth=1 || true

          git checkout -B seen-state
          if git rev-parse --verify origin/seen-state >/dev/null 2>&1; then
            git read-tree -u -m origin/seen-state
          fi

          if [ -f state/seen.json ]; then
            git add -f state/seen.json
            if git diff --staged --quiet; then
              echo "no state change"
            else
              git commit -m "watch: seen-state $(date -u +%FT%TZ)"
            fi
          fi
          git push --force origin seen-state
