name: job-watch

on:
  schedule:
    # every 6 hours: 00,06,12,18 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The dedup memory is not on main, so pull it down before running.
      # Without this the script starts blind and re-mails everything.
      - name: Restore seen-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p state
          if git fetch origin seen-state:state/seen.json --depth=1 2>/dev/null; then
            echo "restored seen-state ($(wc -c < state/seen.json) bytes)"
          else
            echo '{}' > state/seen.json
            echo "no prior seen-state, starting fresh"
          fi

      - name: Run job watch
        # Runs for real: sends the digest and saves seen-state.
        # Locally, test with:  python watch.py --dry-run
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATCH_TO: ${{ secrets.WATCH_TO }}
          WATCH_FROM: ${{ secrets.WATCH_FROM }}
        run: python watch.py

      # Dedup state lives on its own branch so that saving it can never
      # collide with a code push to main. main stays code-only.
      - name: Save seen-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Written through the API rather than by checking out the branch,
          # because checking out seen-state makes git refuse to overwrite the
          # untracked state/seen.json that watch.py just produced.
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error

          data = open("state/seen.json", "rb").read()
          # NOTE: the read must target seen-state too, otherwise it 404s on
          # main, sha stays None, and the PUT is rejected as a duplicate.
          api = ("https://api.github.com/repos/4Hussam/job-watch/contents/"
                 "state/seen.json?ref=seen-state")
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "job-watch",
          }

          sha = None
          req = urllib.request.Request(api, headers=headers)
          try:
              with urllib.request.urlopen(req) as r:
                  sha = json.load(r).get("sha")
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          body = json.dumps({
              "message": "watch: seen-state",
              "content": base64.b64encode(data).decode(),
              "branch": "seen-state",
              **({"sha": sha} if sha else {}),
          }).encode()

          req = urllib.request.Request(api, data=body, headers=headers, method="PUT")
          try:
              with urllib.request.urlopen(req) as r:
                  print("seen-state updated:", r.status)
          except urllib.error.HTTPError as e:
              print("PUT failed:", e.code, e.read().decode()[:400])
              raise
          PY
